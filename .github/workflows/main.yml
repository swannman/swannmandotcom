name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          # The action defaults to wrangler 3.x, which predates _headers
          # support for Static Assets and uploads the file as a plain
          # asset instead of parsing it.
          wranglerVersion: "4.118.0"
